name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare www
        run: |
          mkdir -p www
          cp index.html www/index.html
          ls -la www

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Icons
        run: |
          if [ -f ic_launcher.png ]; then
            pip install pillow
            python3 make_icons.py
          else
            echo "Walang ic_launcher.png sa repo, default icon muna"
          fi

      - name: Audio service and permissions
        run: |
          JAVA=android/app/src/main/java/com/jeiannefm/radio
          mkdir -p $JAVA
          cp MainActivity.java AudioKeepAliveService.java $JAVA/
          python3 patch_manifest.py

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: JeianneFM-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
