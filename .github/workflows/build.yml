name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Icons
        run: |
          pip install pillow
          python3 - <<'PY'
          import os
          from PIL import Image
          res = "android/app/src/main/res"
          if not os.path.exists("ic_launcher.png"):
              print("Walang ic_launcher.png sa repo, default icon ang gagamitin")
              raise SystemExit
          leg = Image.open("ic_launcher.png").convert("RGBA")
          rnd = Image.open("ic_launcher_round.png").convert("RGBA") if os.path.exists("ic_launcher_round.png") else leg
          dens = {"mdpi": (48, 108), "hdpi": (72, 162), "xhdpi": (96, 216), "xxhdpi": (144, 324), "xxxhdpi": (192, 432)}
          for d, (s, f) in dens.items():
              p = f"{res}/mipmap-{d}"
              os.makedirs(p, exist_ok=True)
              for w in ("ic_launcher.webp", "ic_launcher_round.webp", "ic_launcher_foreground.webp"):
                  if os.path.exists(f"{p}/{w}"): os.remove(f"{p}/{w}")
              leg.resize((s, s), Image.LANCZOS).save(p + "/ic_launcher.png")
              rnd.resize((s, s), Image.LANCZOS).save(p + "/ic_launcher_round.png")
              fg = Image.new("RGBA", (f, f), (0, 0, 0, 0))
              n = int(f * 0.60)
              l = rnd.resize((n, n), Image.LANCZOS)
              fg.paste(l, ((f - n) // 2, (f - n) // 2), l)
              fg.save(p + "/ic_launcher_foreground.png")
          os.makedirs(res + "/values", exist_ok=True)
          open(res + "/values/ic_launcher_background.xml", "w").write(
              '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#05071A</color>\n</resources>\n')
          PY

      - name: Background audio service at permissions
        run: |
          JAVA=android/app/src/main/java/com/jeiannefm/radio
          mkdir -p $JAVA
          cat > $JAVA/MainActivity.java <<'EOF'
          package com.jeiannefm.radio;

          import android.Manifest;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  if (Build.VERSION.SDK_INT >= 33
                          && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, 1);
                  }
                  Intent i = new Intent(this, AudioKeepAliveService.class);
                  if (Build.VERSION.SDK_INT >= 26) startForegroundService(i); else startService(i);
              }
          }
          EOF
          cat > $JAVA/AudioKeepAliveService.java <<'EOF'
          package com.jeiannefm.radio;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.PowerManager;

          public class AudioKeepAliveService extends Service {
              private static final String CH = "jeianne_fm_playback";
              private PowerManager.WakeLock wl;

              @Override public IBinder onBind(Intent intent) { return null; }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                  if (Build.VERSION.SDK_INT >= 26) {
                      nm.createNotificationChannel(new NotificationChannel(CH, "Jeianne FM", NotificationManager.IMPORTANCE_LOW));
                  }
                  Intent open = new Intent(this, MainActivity.class).setFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  PendingIntent pi = PendingIntent.getActivity(this, 0, open, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                  Notification.Builder b = (Build.VERSION.SDK_INT >= 26) ? new Notification.Builder(this, CH) : new Notification.Builder(this);
                  Notification n = b.setContentTitle("Jeianne FM")
                          .setContentText("Naka-tune in ang radyo")
                          .setSmallIcon(getApplicationInfo().icon)
                          .setContentIntent(pi)
                          .setOngoing(true)
                          .build();
                  if (Build.VERSION.SDK_INT >= 29) startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK);
                  else startForeground(1, n);
                  if (wl == null) {
                      PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                      wl = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "JeianneFM:audio");
                      wl.acquire();
                  }
                  return START_STICKY;
              }

              @Override public void onTaskRemoved(Intent rootIntent) { stopSelf(); }

              @Override
              public void onDestroy() {
                  if (wl != null && wl.isHeld()) wl.release();
                  super.onDestroy();
              }
          }
          EOF
          python3 - <<'PY'
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          perms = (
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n'
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />\n'
              '    <uses-permission android:name="android.permission.WAKE_LOCK" />\n'
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n'
          )
          svc = '        <service android:name=".AudioKeepAliveService" android:exported="false" android:foregroundServiceType="mediaPlayback" />\n'
          s = s.replace("<application", perms + "\n    <application", 1)
          s = s.replace("</application>", svc + "    </application>", 1)
          open(p, "w", encoding="utf-8").write(s)
          PY

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: JeianneFM-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
