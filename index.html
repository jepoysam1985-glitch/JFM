<!DOCTYPE html>
<html lang="fil">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e1e1e">
<title>Jeianne FM</title>
<style>
:root{--cyan:#22d3ee}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{background:#05071a}
body{min-height:100dvh;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;display:flex;justify-content:center}
.app{width:100%;max-width:360px;min-height:100dvh;display:flex;flex-direction:column;background:linear-gradient(180deg,#0a0f2e 0%,#101a52 18%,#4a1f7a 62%,#2a1352 100%)}
header{background:#1e1e1e;display:flex;align-items:center;justify-content:space-between;padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px}
header h1{font-size:19px;font-weight:500}
.mini{width:26px;height:26px;background:#fff;display:grid;place-items:center}
.mini img{width:25px;height:25px;display:block}
main{flex:1;padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px));text-align:center;display:flex;flex-direction:column}
.title{font-size:29px;font-weight:600;text-shadow:0 0 15px rgba(70,140,255,.9),0 0 4px rgba(120,170,255,.6)}
.sub{margin:5px 0 15px;font-size:13px;color:#e4eaff}
.panel{flex:1;border:1.7px solid rgba(255,255,255,.28);border-radius:26px;padding:10px 10px 12px;background:linear-gradient(180deg,rgba(40,50,110,.35),rgba(60,30,100,.15));display:flex;flex-direction:column;justify-content:space-between}
.art{position:relative;border-radius:19px;padding:7px 0;background:linear-gradient(135deg,#6a6df0 0%,#9a5cf2 55%,#f050c8 100%);border:1.3px solid rgba(255,255,255,.18)}
.live{position:absolute;left:7px;top:7px;display:flex;gap:6px;align-items:center;background:#241f6b;border:1px solid rgba(255,255,255,.12);border-radius:15px;padding:4px 9px;font-weight:700;letter-spacing:.14em;font-size:10px}
.live i{width:8px;height:8px;border-radius:50%;background:#e8365d}
.ring{width:min(38vw,143px);aspect-ratio:1;margin:0 auto;border-radius:50%;border:3px solid rgba(255,255,255,.22);display:grid;place-items:center;padding:5%}
.ring img{width:100%;height:100%;display:block;filter:drop-shadow(0 5px 8px rgba(20,10,80,.45))}
.np{margin-top:8px;color:var(--cyan);letter-spacing:.2em;font-weight:600;font-size:11px}
.song{font-size:16px;font-weight:600;margin-top:2.5px;line-height:1.2}
.artist{font-size:13px;color:#d8dcf6;margin-top:1.7px}
#eq{width:100%;height:75px;margin-top:7px;display:block}
#play{width:58px;height:58px;border-radius:50%;border:1.7px solid rgba(255,255,255,.75);background:rgba(125,130,205,.65);display:grid;place-items:center;margin:5px auto 0;cursor:pointer;box-shadow:0 0 20px rgba(110,130,255,.45)}
#play .stop{width:17px;height:17px;border-radius:3px;background:#fff}
#play .tri{display:none;border-left:19px solid #fff;border-top:12px solid transparent;border-bottom:12px solid transparent;margin-left:5px}
#play.idle .stop{display:none}#play.idle .tri{display:block}
#play:focus-visible,.btn:focus-visible{outline:2.5px solid var(--cyan);outline-offset:2.5px}
.hint{margin-top:8px;font-size:11px;letter-spacing:.08em;color:#eceeff}
.sq{display:inline-block;width:.75em;height:.75em;background:#b9bdf5;margin:0 .1em}
.vol{display:flex;align-items:center;gap:8px;margin:8px 3px 10px}
.vol svg{width:17px;height:17px;fill:#c9cdf2;flex:none}
.vol input{flex:1;accent-color:#fff;height:19px;min-width:0}
.row{display:flex;justify-content:space-between}
.btn{background:none;border:0;color:#fff;font:inherit;font-size:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;flex:1}
.btn b{width:36px;height:36px;border-radius:50%;border:1.3px solid rgba(255,255,255,.35);background:rgba(85,85,140,.55);display:grid;place-items:center;font-size:12px;font-weight:600}
.btn svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round}
.btn.on b{background:#12507f;border-color:var(--cyan)}
#eqPanel{display:none;margin-top:10px;background:rgba(255,255,255,.07);border-radius:14px;padding:10px 8px 8px}
#eqPanel.show{display:block}
.presets{display:flex;gap:5px;justify-content:center;margin-bottom:8px;flex-wrap:wrap}
.presets button{background:rgba(85,85,140,.55);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:14px;padding:4px 10px;font-size:12px;cursor:pointer}
.presets button.sel{background:#12507f;border-color:var(--cyan)}
.bands{display:flex;justify-content:space-around}
.band{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;width:20%;color:#dfe3ff}
.band .sl{height:88px;width:28px;position:relative}
.band input{position:absolute;left:50%;top:50%;width:88px;transform:translate(-50%,-50%) rotate(-90deg);accent-color:var(--cyan)}
#eqNote{font-size:11px;color:#ffd0d8;margin-top:6px}
#recent{display:none;margin-top:10px;text-align:left;background:rgba(255,255,255,.07);border-radius:14px;padding:7px 12px;font-size:12px}
#recent.show{display:block}
#recent li{padding:5px 0;list-style:none;border-bottom:1px solid rgba(255,255,255,.1)}
#recent li:last-child{border:0}
#msg{margin-top:7px;font-size:10px;color:#ffd0d8;min-height:1em}

html,body{overflow-x:hidden}
.bands{flex-wrap:wrap;gap:4px}
.band{width:auto;flex:1 1 0;min-width:0}
.presets button{font-size:11px;padding:4px 8px}
@media (max-width:480px){
  .app{max-width:none;width:100%}
  main{padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px))}
  .title{font-size:clamp(22px,8vw,29px)}
  .panel{padding:8px 8px 10px}
  .ring{width:min(34vw,130px)}
  #eq{height:60px}
  #play{width:52px;height:52px}
  .band .sl{height:72px}
  .band input{width:72px}
  .btn{font-size:10px}
  .btn b{width:32px;height:32px}
}
@media (max-height:720px){
  .sub{margin:2px 0 8px}
  .ring{width:min(28vw,110px)}
  #eq{height:48px;margin-top:4px}
  #play{width:46px;height:46px;margin-top:2px}
  .hint{margin-top:4px}
  .vol{margin:4px 3px 6px}
  .art{padding:5px 0}
}

/* ===== Bagong style ===== */
.ring{position:relative;background:radial-gradient(circle,rgba(255,255,255,.14),rgba(255,255,255,0) 70%);box-shadow:0 0 0 3px rgba(255,255,255,.28),0 0 26px rgba(34,211,238,.55),0 0 52px rgba(240,80,200,.45),inset 0 0 18px rgba(255,255,255,.18)}
.ring::before{content:"";position:absolute;inset:-9px;border-radius:50%;background:conic-gradient(from 0deg,#22d3ee,#8b5cf6,#f050c8,#fbbf24,#22d3ee);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));animation:spin 6s linear infinite;opacity:.9}
.ring img{border-radius:50%;filter:drop-shadow(0 6px 12px rgba(20,10,80,.6)) drop-shadow(0 0 10px rgba(34,211,238,.6));animation:float 3.2s ease-in-out infinite}
.ring.playing img{animation:float 3.2s ease-in-out infinite,pulse 1.2s ease-in-out infinite}
.ring.hasart img{border-radius:14px;object-fit:cover;filter:drop-shadow(0 8px 14px rgba(0,0,0,.55))}
.ring.hasart{padding:3%}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes pulse{0%,100%{filter:drop-shadow(0 6px 12px rgba(20,10,80,.6)) drop-shadow(0 0 8px rgba(34,211,238,.5))}50%{filter:drop-shadow(0 6px 12px rgba(20,10,80,.6)) drop-shadow(0 0 22px rgba(240,80,200,.9))}}
.mini{border-radius:7px;box-shadow:0 0 10px rgba(34,211,238,.7);overflow:hidden}
.title{background:linear-gradient(90deg,#fff,#7dd3fc,#f0abfc,#fff);background-size:200% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shine 5s linear infinite;letter-spacing:.02em;filter:drop-shadow(0 0 10px rgba(70,140,255,.8))}
@keyframes shine{to{background-position:200% center}}
#recent li{display:flex;align-items:center;gap:8px}
#recent li img{width:30px;height:30px;border-radius:6px;object-fit:cover;flex:none;background:rgba(255,255,255,.1)}
#recent li small{display:block;color:#c9cdf2;font-size:11px}
@media (prefers-reduced-motion:reduce){.ring::before,.ring img,.title{animation:none}}

/* ===== Music-synced glow + title ===== */
.ring{--e:0;box-shadow:0 0 0 3px rgba(255,255,255,.28),0 0 calc(18px + var(--e)*50px) rgba(34,211,238,calc(.4 + var(--e)*.6)),0 0 calc(36px + var(--e)*80px) rgba(240,80,200,calc(.3 + var(--e)*.7)),inset 0 0 18px rgba(255,255,255,.18)}
.ring::before{opacity:calc(.6 + var(--e)*.4)}
.ring.playing img{animation:none;transform:scale(calc(1 + var(--e)*.09));filter:drop-shadow(0 6px 12px rgba(20,10,80,.6)) drop-shadow(0 0 calc(8px + var(--e)*28px) rgba(34,211,238,calc(.5 + var(--e)*.5))) drop-shadow(0 0 calc(var(--e)*34px) rgba(240,80,200,var(--e)))}
.title{color:#fff;font-size:30px;line-height:1.15;padding:2px 0}
.song{font-size:19px;font-weight:700;color:#fff;text-shadow:0 0 12px rgba(34,211,238,.85),0 2px 4px rgba(0,0,0,.5);word-break:break-word;padding:0 6px}
.artist{font-size:14px;color:#e4e8ff}
main{padding-top:calc(18px + env(safe-area-inset-top,0px))}

/* ===== Mas malaking cover art + title ===== */
.art{padding:16px 0 14px}
.ring{width:min(58vw,230px);margin-top:14px}
.ring.hasart{border-radius:24px;padding:0;border:0}
.ring.hasart::before{display:none}
.ring.hasart img{border-radius:24px;width:100%;height:100%;box-shadow:0 0 0 2px rgba(255,255,255,.35)}
.np{margin-top:12px}
.song{font-size:21px;line-height:1.25;margin-top:6px}
.artist{font-size:15px;margin-top:4px}
@media (max-height:720px){.ring{width:min(44vw,170px)}.song{font-size:18px}}

/* ===== Beat glow ===== */
.ring{--k:0;box-shadow:0 0 0 3px rgba(255,255,255,.28),0 0 calc(16px + var(--e)*70px) rgba(34,211,238,calc(.35 + var(--e)*.65)),0 0 calc(30px + var(--e)*110px) rgba(240,80,200,calc(.25 + var(--e)*.75)),0 0 calc(var(--k)*60px) rgba(251,191,36,calc(var(--k)*.6)),inset 0 0 18px rgba(255,255,255,.18)}
.ring::after{content:"";position:absolute;inset:-4px;border-radius:inherit;border:3px solid rgba(125,211,252,.95);pointer-events:none;transform:scale(calc(1 + var(--k)*.28));opacity:calc(var(--k)*.9)}
.ring.playing img{transform:scale(calc(1 + var(--e)*.12))}

/* ===== Logo hindi gumagalaw; spectrum lang sa paligid ===== */
.ring img,.ring.playing img,.ring.hasart img{animation:none !important;transform:none !important}
.ring::before,.ring::after{display:none !important}
.ring{box-shadow:0 0 0 2px rgba(255,255,255,.22),0 0 calc(14px + var(--e)*34px) rgba(34,211,238,calc(.25 + var(--e)*.45)),0 0 calc(26px + var(--e)*50px) rgba(240,80,200,calc(.2 + var(--e)*.4))}
.ring.playing img,.ring img{filter:drop-shadow(0 6px 12px rgba(20,10,80,.55)) !important}
.art{padding:44px 0 40px}
.ring{margin-top:0}
.art{padding:32px 0 30px}

/* ===== Cover art sa mismong player ===== */
.ring.hasart{border-radius:50%;padding:5%}
.ring{width:min(46vw,190px)}
.art{padding:30px 0 28px}
.card{display:flex;align-items:center;gap:12px;margin:10px 4px 0;padding:10px;border-radius:18px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);text-align:left}
#album{width:84px;height:84px;border-radius:14px;object-fit:cover;flex:none;background:#2a2f6a;box-shadow:0 6px 18px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.25)}
.card .txt{min-width:0;flex:1}
.card .song{margin:0;padding:0;font-size:18px;line-height:1.25;text-align:left}
.card .artist{margin:4px 0 0;font-size:14px;text-align:left}
.np{margin-top:10px}
@media (max-height:720px){.ring{width:min(38vw,140px)}#album{width:64px;height:64px}.card .song{font-size:16px}}

/* ===== Cover art sa logo; liliit ang logo kapag may cover ===== */
.ring.hasart{border-radius:50%;padding:3%}
.ring.hasart img#cover{border-radius:50% !important;object-fit:cover;width:100%;height:100%;box-shadow:none}
#logoBadge{position:absolute;right:-3%;bottom:-3%;width:34%;aspect-ratio:1;border-radius:50%;background-size:contain;background-position:center;background-repeat:no-repeat;background-color:#fff;border:2px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.5),0 0 12px rgba(34,211,238,.7);z-index:3;opacity:0;transform:scale(2.6) translate(-40%,-40%);transform-origin:center;transition:opacity .5s ease,transform .6s cubic-bezier(.2,.9,.3,1.2);pointer-events:none}
.ring.hasart #logoBadge{opacity:1;transform:none}

/* ===== Active cover art: sumasabay sa beat ===== */
.ring img#cover{transition:opacity .35s ease}
@media (prefers-reduced-motion:no-preference){
  .ring.playing img#cover{transform:scale(calc(1 + var(--e)*.04 + var(--k)*.06)) !important;transition:opacity .35s ease,transform .07s linear}
  .ring.playing{box-shadow:0 0 0 2px rgba(255,255,255,.3),0 0 calc(18px + var(--e)*50px + var(--k)*40px) rgba(34,211,238,calc(.35 + var(--e)*.5)),0 0 calc(34px + var(--e)*80px + var(--k)*50px) rgba(240,80,200,calc(.3 + var(--e)*.5))}
  .ring.playing::after{display:block !important;inset:-6px;border-color:rgba(165,243,252,.95)}
}

/* ===== Logo: lumiliit at lumilipat sa gilid kapag may cover art ===== */
#logoBadge{opacity:0;transform:translate(-106%,-106%) scale(2.7);transition:opacity .25s ease .05s,transform .7s cubic-bezier(.2,.9,.3,1)}
.ring.hasart #logoBadge{opacity:1;transform:none}
@media (prefers-reduced-motion:no-preference){.ring.playing.hasart #logoBadge{scale:calc(1 + var(--k)*.12)}}
@media (prefers-reduced-motion:reduce){#logoBadge{transition:none}}

/* ===== Walang puting paikot sa logo/cover ===== */
.ring,.ring.hasart{border:0 !important}
.ring{box-shadow:0 0 calc(14px + var(--e)*34px) rgba(34,211,238,calc(.25 + var(--e)*.45)),0 0 calc(26px + var(--e)*50px) rgba(240,80,200,calc(.2 + var(--e)*.4)) !important}
.ring.playing{box-shadow:0 0 calc(18px + var(--e)*50px + var(--k)*40px) rgba(34,211,238,calc(.35 + var(--e)*.5)),0 0 calc(34px + var(--e)*80px + var(--k)*50px) rgba(240,80,200,calc(.3 + var(--e)*.5)) !important}
.ring::after,.ring.playing::after{display:none !important}
.ring img,.ring.hasart img#cover{box-shadow:none !important}

/* ===== Mas malaking logo/cover ===== */
.ring{width:min(64vw,260px)}
.art{padding:26px 0 24px}
@media (max-height:720px){.ring{width:min(52vw,200px)}}

/* ===== Cover art: buong laki ng pinaglalagyan ng logo ===== */
.ring.hasart{padding:0 !important}
.ring.hasart img#cover{border-radius:50% !important;width:100%;height:100%;object-fit:cover}

/* ===== Square cover art ===== */
.ring{transition:border-radius .4s ease}
.ring.hasart{border-radius:22px !important}
.ring.hasart img#cover{border-radius:22px !important}

/* ===== Walang galaw ang cover at logo ===== */
.ring img,.ring.playing img,.ring.playing img#cover,.ring.hasart img#cover{transform:none !important;animation:none !important}
.ring.playing.hasart #logoBadge,.ring.playing #logoBadge{scale:1 !important}

/* ===== LIVE / OFFLINE: tuldok lang ang kumukurap, smooth ===== */
.live{animation:none}
.live i{animation:liveBlink 1.6s ease-in-out infinite;box-shadow:0 0 8px #e8365d}
.live.off i{animation:none;background:#8b90b8;box-shadow:none;opacity:1}
@keyframes liveBlink{0%,100%{opacity:1}50%{opacity:.15}}

/* ===== Puting title ===== */
.title{background:none !important;-webkit-background-clip:border-box !important;background-clip:border-box !important;-webkit-text-fill-color:#fff !important;color:#fff !important;animation:none !important}

/* ===== Bold italic sans ang lahat ng text ===== */
*{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif !important;font-weight:700 !important;font-style:italic !important}
.title{font-style:normal !important}
</style>
</head>

<script>
// ===== Settings =====
// Permanenteng URL ng Zeno stream (walang expiring token).
const STREAM_URL = "https://stream.zeno.fm/c8ysmnpagphvv";
const NOW_PLAYING = { title: "Jeianne FM Live", artist: "Online Radio" };
// Opsyonal: kung may JSON API ang station ng kasalukuyang kanta, ilagay dito (hal. {title, artist}). Iwanang "" para gamitin ang ICY metadata ng stream.
const NOWPLAYING_API = "";
let API = NOWPLAYING_API;   // Zeno SSE ang gagamitin (startZeno)

const $ = id => document.getElementById(id);
const audio = $("audio"), play = $("play"), msg = $("msg");
let playing = false, sleepTimer = null, sleepIdx = 0, recent = [];

const LOGO_SRC = $("cover").src; $("logoBadge").style.backgroundImage = "url(" + LOGO_SRC + ")";
const artCache = {};
const cleanT = s => (s||"").replace(/[(\[].*?[)\]]/g,"").replace(/\b(feat|ft|featuring)\.?.*$/i,"").replace(/\s*-\s*(remaster(ed)?|live|official|radio edit|lyric|version).*$/i,"").replace(/\s+/g," ").trim();
const normT = s => cleanT(s).toLowerCase().replace(/[^\p{L}\p{N} ]/gu,"").trim();
const generic = a => !a || /jeianne|online radio/i.test(a);
function artistOk(x, artist){ if(generic(artist)) return true; const na = normT(artist), nx = normT(x); return !!nx && (nx.includes(na) || na.includes(nx) || nx.split(" ")[0] === na.split(" ")[0]); }
async function itunesList(term, country){
  try{
    const r = await fetch("https://itunes.apple.com/search?media=music&entity=song&limit=15&country=" + country + "&term=" + encodeURIComponent(term));
    return (await r.json()).results || [];
  }catch(e){ return []; }
}
const itArt = x => x && x.artworkUrl100 ? x.artworkUrl100.replace("100x100bb","600x600bb") : "";
async function itunesArt(title, artist, loose){
  const nt = normT(title);
  for(const c of ["US","PH"]){
    for(const term of (generic(artist) ? [title] : [title + " " + artist, title])){
      const res = await itunesList(term, c);
      const best = res.find(x => normT(x.trackName) === nt && artistOk(x.artistName, artist))
        || res.find(x => artistOk(x.artistName, artist) && (normT(x.trackName).includes(nt) || nt.includes(normT(x.trackName))))
        || (loose ? res.find(x => normT(x.trackName) === nt) || res[0] : null);
      if(best && itArt(best)) return itArt(best);
    }
  }
  return "";
}
function jsonp(url){ return new Promise((res,rej) => {
  const cb = "dz" + Date.now() + Math.floor(Math.random()*1e4), sc = document.createElement("script");
  const done = () => { delete window[cb]; sc.remove(); };
  window[cb] = d => { done(); res(d); }; sc.onerror = () => { done(); rej(); };
  sc.src = url + "&output=jsonp&callback=" + cb; document.head.appendChild(sc);
  setTimeout(() => { if(window[cb]){ done(); rej(); } }, 6000); }); }
async function deezerArt(title, artist, loose){
  try{
    const nt = normT(title);
    const j = await jsonp("https://api.deezer.com/search?limit=15&q=" + encodeURIComponent(generic(artist) ? title : title + " " + artist));
    const d = j.data || [];
    const best = d.find(x => normT(x.title) === nt && artistOk(x.artist && x.artist.name, artist))
      || d.find(x => artistOk(x.artist && x.artist.name, artist) && x.album)
      || (loose ? d[0] : null);
    if(best && best.album && (best.album.cover_xl || best.album.cover_big)) return best.album.cover_xl || best.album.cover_big;
    const ar = d.find(x => x.artist && artistOk(x.artist.name, artist) && !generic(artist));
    if(loose && ar && ar.artist.picture_xl) return ar.artist.picture_xl;
  }catch(e){}
  return "";
}
function imgOk(u){ return new Promise(r => { const i = new Image(); i.onload = () => r(true); i.onerror = () => r(false); i.src = u; setTimeout(() => r(false), 6000); }); }
async function mbArt(title, artist){
  try{
    const q = 'recording:"' + title + '"' + (generic(artist) ? "" : ' AND artist:"' + artist + '"');
    const r = await fetch("https://musicbrainz.org/ws/2/release/?fmt=json&limit=6&query=" + encodeURIComponent(q));
    const rel = (await r.json()).releases || [];
    for(const x of rel){ const u = "https://coverartarchive.org/release/" + x.id + "/front-500"; if(await imgOk(u)) return u; }
  }catch(e){}
  return "";
}
async function artistPic(name){
  if(generic(name)) return "";
  try{
    const n = normT(name), j = await jsonp("https://api.deezer.com/search/artist?limit=8&q=" + encodeURIComponent(cleanT(name)));
    const d = j.data || [], best = d.find(x => normT(x.name) === n) || d.find(x => artistOk(x.name, name));
    return best ? (best.picture_xl || best.picture_big || "") : "";
  }catch(e){ return ""; }
}
async function fetchArt(t){
  if(t.art) return t.art;
  const key = t.title + "|" + t.artist;
  if(key in artCache) return artCache[key];
  const pairs = [[t.title, t.artist]]; if(!generic(t.artist)) pairs.push([t.artist, t.title]); // baka baligtad ang Artist/Title
  let url = "";
  for(const [ti, ar] of pairs){ url = (await itunesArt(ti, ar)) || (await deezerArt(ti, ar)); if(url) break; }
  if(!url) for(const [ti, ar] of pairs){ url = await mbArt(ti, ar); if(url) break; }
  if(!url) for(const [ti, ar] of pairs){ url = (await itunesArt(ti, ar, true)) || (await deezerArt(ti, ar, true)); if(url) break; }
  if(!url) url = await artistPic(t.artist); // huling pag-asa lang
  artCache[key] = url; return url;
}
function setCover(url){
  const img = $("cover"), ring = $("ring"), target = url || LOGO_SRC;
  if(img.src === target){ ring.classList.toggle("hasart", !!url); return; }
  const apply = (src, art) => { ring.classList.toggle("hasart", art); img.style.opacity = 0; setTimeout(() => { img.src = src; img.style.opacity = 1; }, 220); };
  const pre = new Image(); pre.onload = () => apply(target, !!url); pre.onerror = () => apply(LOGO_SRC, false); pre.src = target;
}
function renderRecent(){
  const ul = $("recent"); ul.innerHTML = "";
  if(!recent.length){ ul.innerHTML = "<li>Wala pang history</li>"; return; }
  recent.forEach(r => {
    const li = document.createElement("li");
    if(r.art){ const im = document.createElement("img"); im.src = r.art; im.alt = ""; li.appendChild(im); }
    const d = document.createElement("div"); d.innerHTML = "<span></span><small></small>";
    d.children[0].textContent = r.title; d.children[1].textContent = r.artist + (r.time ? " · " + r.time : "");
    li.appendChild(d); ul.appendChild(li);
  });
}
let nowSeq = 0;
async function setNow(t){
  const seq = ++nowSeq;
  $("song").textContent = t.title; $("artist").textContent = t.artist; document.title = t.title + " — " + t.artist + " · Jeianne FM";
  const art = t === NOW_PLAYING ? "" : await fetchArt(t);
  if(seq !== nowSeq) return;
  setCover(art);
  if("mediaSession" in navigator){
    navigator.mediaSession.metadata = new MediaMetadata({title:t.title, artist:t.artist, album:"Jeianne FM", artwork: art ? [{src:art, sizes:"600x600", type:"image/jpeg"}] : []});
  }
  if(!recent[0] || recent[0].title !== t.title || recent[0].artist !== t.artist){
    const time = new Date().toLocaleTimeString("fil-PH",{hour:"2-digit",minute:"2-digit"});
    recent.unshift({title:t.title, artist:t.artist, art, time}); recent = recent.slice(0,10);
    renderRecent();
  }
}
setNow(NOW_PLAYING);

function setUi(on){
  $("live").classList.toggle("off", !on); $("liveTxt").textContent = on ? "LIVE" : "OFFLINE";
  playing = on; play.classList.toggle("idle", !on); $("ring").classList.toggle("playing", on);
  play.setAttribute("aria-label", on ? "Stop" : "Play");
  $("hint").innerHTML = on ? 'Tumutugtog · pindutin ang <span class="sq"></span> para tumigil' : "I-tap ang ▶ para makinig";
}
let edges=[], ctx=null, bands=[], hdLow, hdHigh, comp, analyser, fxOk=false, fxTried=false, bins;
const FREQS=[60,230,910,3600,14000], LABELS=["60","230","910","3.6k","14k"];
const PRESETS={Flat:[0,0,0,0,0],Bass:[7,4,0,0,0],Vocal:[-2,0,4,3,-1],Treble:[0,0,0,4,7],Rock:[5,2,-2,3,5]};
function buildGraph(){
  if(ctx){ ctx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  ctx = new AC(); const src = ctx.createMediaElementSource(audio);
  bands = FREQS.map((f,i) => { const n = ctx.createBiquadFilter();
    n.type = i===0 ? "lowshelf" : i===4 ? "highshelf" : "peaking"; n.frequency.value=f; n.Q.value=1; n.gain.value=+bandInputs[i].value; return n; });
  hdLow = ctx.createBiquadFilter(); hdLow.type="lowshelf"; hdLow.frequency.value=120;
  hdHigh = ctx.createBiquadFilter(); hdHigh.type="highshelf"; hdHigh.frequency.value=7000;
  comp = ctx.createDynamicsCompressor();
  analyser = ctx.createAnalyser(); analyser.fftSize = 2048; analyser.smoothingTimeConstant = 0.55; analyser.minDecibels = -85; analyser.maxDecibels = -28;
  const hz = ctx.sampleRate/analyser.fftSize; edges = [];
  for(let i=0;i<=N;i++) edges.push(Math.max(1, Math.round(50*Math.pow(16000/50, i/N)/hz))); bins = new Uint8Array(analyser.frequencyBinCount);
  const chain = [src, ...bands, hdLow, hdHigh, comp, analyser, ctx.destination];
  for(let i=0;i<chain.length-1;i++) chain[i].connect(chain[i+1]);
  fxOk = true; applyHd(); $("eqNote").textContent = "";
}
function applyHd(){
  if(!fxOk) return; const on = $("bHd").classList.contains("on");
  hdLow.gain.value = on ? 3 : 0; hdHigh.gain.value = on ? 4 : 0;
  comp.threshold.value = on ? -24 : 0; comp.ratio.value = on ? 3 : 1; comp.knee.value = on ? 20 : 0;
}
async function startStream(cors){
  audio.pause(); audio.removeAttribute("src");
  if(cors) audio.crossOrigin = "anonymous"; else audio.removeAttribute("crossorigin");
  audio.src = STREAM_URL; audio.volume = +$("vol").value; await audio.play();
}
play.onclick = async () => {
  msg.textContent = "";
  if(playing){ audio.pause(); audio.removeAttribute("src"); audio.load(); setUi(false); stopMeta(); return; }
  try{
    if(!fxTried || fxOk){ try{ await startStream(true); fxTried = true; buildGraph(); }
      catch(e){ fxTried = true; fxOk = false; await startStream(false); } }
    else await startStream(false);
    setUi(true); startMeta();
    if(!fxOk) $("eqNote").textContent = "Hindi sinusuportahan ng stream na ito ang EQ at HD Sound (walang CORS). Nakikinig ka pa rin nang normal.";
  }catch(e){
    setUi(false);
    msg.textContent = "Hindi ma-play ang stream. Baka expired na ang token ng link — gumamit ng bagong URL.";
  }
};
audio.onerror = () => { if(playing){ stopMeta(); setUi(false); msg.textContent = "Naputol ang stream. Subukan ulit."; } };
$("vol").oninput = e => audio.volume = +e.target.value;


// ===== Live na title (ICY metadata ng stream) =====
let metaTimer = null, metaAbort = null, metaFails = 0;
function parseTitle(raw){
  raw = (raw||"").replace(/\s+/g," ").trim(); if(!raw) return null;
  const i = raw.indexOf(" - ");
  return i > 0 ? {artist: raw.slice(0,i).trim(), title: raw.slice(i+3).trim()} : {artist: "Jeianne FM", title: raw};
}
function decodeBytes(b){ try{ return new TextDecoder("utf-8",{fatal:true}).decode(b); }catch(e){ return new TextDecoder("latin1").decode(b); } }
async function readIcy(){
  metaAbort = new AbortController();
  const r = await fetch(STREAM_URL, {headers:{"Icy-MetaData":"1"}, signal: metaAbort.signal, cache:"no-store"});
  const metaint = +r.headers.get("icy-metaint");
  if(!metaint) throw new Error("walang icy-metaint");
  const rd = r.body.getReader(); let buf = new Uint8Array(0), need = metaint, state = 0, len = 0, result = null;
  const push = c => { const n = new Uint8Array(buf.length + c.length); n.set(buf); n.set(c, buf.length); buf = n; };
  while(!result){
    const {value, done} = await rd.read(); if(done) break; push(value);
    for(;;){
      if(state === 0){ if(buf.length < need) break; buf = buf.slice(need); state = 1; }
      if(state === 1){ if(!buf.length) break; len = buf[0]*16; buf = buf.slice(1); if(!len){ state = 0; need = metaint; continue; } state = 2; }
      if(state === 2){ if(buf.length < len) break;
        const txt = decodeBytes(buf.slice(0,len)).replace(/\0+$/,""); const m = /StreamTitle='([^]*?)';/.exec(txt);
        result = parseTitle(m ? m[1] : ""); break; }
    }
  }
  try{ metaAbort.abort(); }catch(e){}
  return result;
}

async function readEndpoints(){
  const u = new URL(STREAM_URL), o = u.origin, mount = u.pathname;
  const tryFetch = async (path, kind) => {
    const r = await fetch(o + path, {cache:"no-store"}); if(!r.ok) throw 0;
    if(kind === "ice"){ const j = await r.json(); let src = j.icestats && j.icestats.source; if(Array.isArray(src)) src = src.find(x => (x.listenurl||"").includes(mount)) || src[0]; if(src && (src.title || src.yp_currently_playing)) return parseTitle(src.artist ? src.artist + " - " + src.title : (src.title || src.yp_currently_playing)); throw 0; }
    if(kind === "sc2"){ const j = await r.json(); if(j.songtitle) return parseTitle(j.songtitle); throw 0; }
    const t = await r.text();
    if(kind === "7"){ const m = /<body>(.*?)<\/body>/is.exec(t); const parts = m ? m[1].split(",") : []; if(parts.length > 6) return parseTitle(parts.slice(6).join(",")); throw 0; }
    if(t.trim() && t.length < 300) return parseTitle(t); throw 0;
  };
  for(const [path, kind] of [["/status-json.xsl","ice"],["/stats?sid=1&json=1","sc2"],["/7.html","7"],["/currentsong?sid=1","txt"]]){
    try{ const r = await tryFetch(path, kind); if(r) return r; }catch(e){}
  }
  throw new Error("walang endpoint");
}
async function readAuto(){ try{ return await readIcy(); }catch(e){ return await readEndpoints(); } }
async function readApi(){
  const rs = await fetch(API, {cache:"no-store"}); if(!rs.ok) throw new Error("api " + rs.status); const j = await rs.json();
  const ic = j.icestats && j.icestats.source; const src = Array.isArray(ic) ? ic[0] : ic;
  if(j.title) return {title:j.title, artist:j.artist || "Jeianne FM", art:j.art || ""};
  if(src && src.title) return parseTitle(src.artist ? src.artist + " - " + src.title : src.title);
  return null;
}
async function pollMeta(){
  if(!playing) return;
  try{
    const t = NOWPLAYING_API ? await readApi() : await readAuto();
    metaFails = 0;
    if(t && t.title && (t.title !== lastMeta.title || t.artist !== lastMeta.artist)){ lastMeta = t; setNow(t); }
  }catch(e){ metaFails++; if(metaFails === 2) $("eqNote").textContent = "Hindi mabasa ng browser ang live title ng stream na ito. I-tap ang pamagat ng kanta para i-type ito mano-mano."; }
  if(playing && metaFails < 6) metaTimer = setTimeout(pollMeta, 15000);
}
let lastMeta = {};
// ===== Zeno.fm live metadata (SSE) =====
let zenoES = null;
function zenoMount(){ try{ const m = new URL(STREAM_URL).pathname.split("/").filter(Boolean)[0]; return m || ""; }catch(e){ return ""; } }
function handleZeno(d){
  let title = "";
  try{ const j = JSON.parse(d); title = j.streamTitle || j.title || j.song || (j.metadata && j.metadata.title) || ""; }catch(e){ title = d; }
  const t = parseTitle(title);
  if(t && t.title && (t.title !== lastMeta.title || t.artist !== lastMeta.artist)){ lastMeta = t; setNow(t); }
  return !!t;
}
function startZeno(){
  const mount = zenoMount(); if(!mount || !window.EventSource) return false;
  stopZeno(); let got = false;
  zenoES = new EventSource("https://api.zeno.fm/mounts/metadata/subscribe/" + mount);
  zenoES.onmessage = e => { if(handleZeno(e.data)){ got = true; $("eqNote").textContent = ""; } };
  zenoES.addEventListener("metadata", e => { if(handleZeno(e.data)) got = true; });
  zenoES.onerror = () => { if(!got){ stopZeno(); pollMeta(); } };
  return true;
}
function stopZeno(){ if(zenoES){ zenoES.close(); zenoES = null; } }

$("song").style.cursor = "pointer"; $("song").title = "I-tap para i-edit ang title";
$("song").onclick = () => {
  const v = prompt("Title ng kanta (Artist - Title):", ($("artist").textContent !== "Online Radio" ? $("artist").textContent + " - " : "") + $("song").textContent);
  if(!v) return; const t = parseTitle(v); lastMeta = t; setNow(t);
};

let apiFails = 0, apiTimer = null;
async function pollApi(){
  if(!playing) return;
  try{ const t = await readApi(); apiFails = 0; $("eqNote").textContent = "";
    if(t && t.title && (t.title !== lastMeta.title || t.artist !== lastMeta.artist)){ lastMeta = t; setNow(t); }
  }catch(e){ apiFails++; if(apiFails >= 1){ API = ""; if(!startZeno()) pollMeta(); return; } }
  apiTimer = setTimeout(pollApi, 10000);
}
function startMeta(){ stopMeta(); metaFails = 0; apiFails = 0; if(API) pollApi(); else if(!startZeno()) pollMeta(); }
function stopMeta(){ clearTimeout(apiTimer); stopZeno(); clearTimeout(metaTimer); try{ metaAbort && metaAbort.abort(); }catch(e){} }

const bandInputs = [];
FREQS.forEach((f,i) => { const d = document.createElement("div"); d.className="band";
  d.innerHTML = '<span class="g">0</span><div class="sl"><input type="range" min="-12" max="12" step="1" value="0" aria-label="'+LABELS[i]+' Hz"></div><span>'+LABELS[i]+'</span>';
  const inp = d.querySelector("input"); bandInputs.push(inp);
  inp.oninput = () => { d.querySelector(".g").textContent = inp.value; if(bands[i]) bands[i].gain.value = +inp.value; markPreset(null); };
  $("bands").appendChild(d); });
function markPreset(name){ [...$("presets").children].forEach(b => b.classList.toggle("sel", b.textContent===name)); }
Object.keys(PRESETS).forEach(name => { const b = document.createElement("button"); b.textContent = name;
  b.onclick = () => { PRESETS[name].forEach((v,i) => { bandInputs[i].value = v; bandInputs[i].oninput(); }); markPreset(name); };
  $("presets").appendChild(b); });
markPreset("Flat");
$("bEq").onclick = e => { $("eqPanel").classList.toggle("show"); e.currentTarget.classList.toggle("on"); };
$("bHd").onclick = e => { e.currentTarget.classList.toggle("on"); applyHd(); msg.textContent = fxOk || !playing ? "" : "Hindi gagana ang HD Sound sa stream na ito."; };
$("bRecent").onclick = e => { $("recent").classList.toggle("show"); e.currentTarget.classList.toggle("on"); renderRecent(); };
let sleepEnd = 0, sleepTick = null;
function stopSleep(){ clearTimeout(sleepTimer); clearInterval(sleepTick); sleepEnd = 0; sleepIdx = 0; $("sleepLbl").textContent = "Sleep"; $("bSleep").classList.remove("on"); }
function showSleep(){
  const left = Math.max(0, sleepEnd - Date.now()), m = Math.floor(left/60000), sec = Math.floor(left%60000/1000);
  $("sleepLbl").textContent = m + ":" + String(sec).padStart(2,"0");
}
$("bSleep").onclick = () => {
  const opts = [0,15,30,60]; sleepIdx = (sleepIdx+1) % opts.length;
  clearTimeout(sleepTimer); clearInterval(sleepTick);
  const m = opts[sleepIdx];
  if(!m){ stopSleep(); msg.textContent = "Sleep timer: patay"; return; }
  sleepEnd = Date.now() + m*60000;
  $("bSleep").classList.add("on"); showSleep();
  sleepTick = setInterval(showSleep, 1000);
  sleepTimer = setTimeout(() => { if(playing) play.click(); stopSleep(); msg.textContent = "Huminto na ang radyo (Sleep timer)."; }, m*60000);
  msg.textContent = "Titigil ang radyo sa " + m + " minuto.";
};

// ===== Visualizer (galing sa totoong audio kung may CORS ang stream) =====
const cv = $("eq"), cx = cv.getContext("2d"), N = 16, ROWS = 14;
const level = Array(N).fill(0), target = Array(N).fill(0), peak = Array(N).fill(0);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
function fit(){ const r = devicePixelRatio||1; cv.width = cv.clientWidth*r; cv.height = cv.clientHeight*r; }
addEventListener("resize", fit); fit();
function rowColor(r){ return r<2 ? "#2dd4bf" : r<5 ? "#3b82f6" : r<8 ? "#8b5cf6" : "#ec4899"; }
let tick = 0, ringE = 0, kick = 0, bassAvg = 0, lastKick = 0, nextKick = 0;
(function draw(){
  const W = cv.width, H = cv.height, barsH = H*.8, gap = W/N, bw = gap*.8, rh = barsH/ROWS;
  if(playing && fxOk && analyser){ analyser.getByteFrequencyData(bins);
    for(let i=0;i<N;i++){ let a = edges[i], b = Math.max(edges[i+1], a+1), m = 0;
      for(let k=a;k<b;k++) if(bins[k] > m) m = bins[k];
      target[i] = Math.min(ROWS, (m/255) * ROWS * (1 + i/N*.6)); } }
  else if(tick++ % 7 === 0) for(let i=0;i<N;i++) target[i] = playing && !reduce ? 3+Math.random()*(ROWS-3)*(.5+.5*Math.sin((i+.5)/N*Math.PI)) : 0;
  cx.clearRect(0,0,W,H);
  for(let i=0;i<N;i++){
    level[i] += (target[i]-level[i])*(fxOk && playing ? (target[i]>level[i] ? .7 : .3) : .22);
    peak[i] = Math.max(level[i], peak[i]-.08);
    const x = i*gap+(gap-bw)/2;
    for(let r=0;r<ROWS;r++){
      const y = barsH-(r+1)*rh+2;
      cx.fillStyle = r < level[i] ? rowColor(r) : "rgba(255,255,255,.14)";
      cx.fillRect(x, y, bw, rh-3);
      if(r < level[i]){ cx.globalAlpha=.18; cx.fillStyle=rowColor(r); cx.fillRect(x, barsH+(r+1)*rh*.45, bw, rh*.3); cx.globalAlpha=1; }
    }
    if(playing && peak[i] > 1){ cx.fillStyle="#fbbf24"; cx.fillRect(x, barsH-Math.ceil(peak[i])*rh-rh+2, bw, rh-3); }
  }
  { let e = 0, now = performance.now();
    if(playing){
      let sum = 0, bass = 0; for(let i=0;i<N;i++){ sum += level[i]; if(i<4) bass += level[i]; }
      bass = bass/4/ROWS; const avg = sum/N/ROWS; e = Math.min(1, bass*.6 + avg*.5);
      if(fxOk && analyser){ // totoong beat: biglang taas ng bass kumpara sa karaniwan
        bassAvg += (bass - bassAvg)*.04;
        if(bass > bassAvg*1.22 && bass > .22 && now - lastKick > 180){ kick = 1; lastKick = now; }
      } else { // walang CORS: ritmong ~ 120 BPM para sumabay ang itsura
        if(now >= nextKick){ kick = 1; nextKick = now + 480 + Math.random()*60; }
      }
    }
    kick *= .9; if(kick < .01) kick = 0;
    const out = Math.max(e*.7, kick);
    ringE += (out - ringE) * (out > ringE ? .8 : .2);
    const rg = $("ring"); rg.style.setProperty("--e", ringE.toFixed(3)); rg.style.setProperty("--k", kick.toFixed(3)); }
  cx.fillStyle="rgba(200,110,110,.55)";
  for(let k=0;k<4;k++) cx.fillRect(0, barsH+4+k*7*(devicePixelRatio||1)*.6, W, 2);
  requestAnimationFrame(draw);
})();

if("mediaSession" in navigator){
  
  navigator.mediaSession.setActionHandler("play", () => { if(!playing) play.click(); });
  navigator.mediaSession.setActionHandler("pause", () => { if(playing) play.click(); });
}
